# ============================================================
# NIVARA — Continuous Integration
# Branch:   feature/devsecops  (Member 4 owns this file)
# Triggers: push to any branch, PR to main
#
# Job sequence:
#   rust-checks ──┐
#                 ├──► security-scan ──► docker-build
#   python-checks─┘
# ============================================================

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

# Cancel in-progress runs on the same branch to save minutes
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ----------------------------------------------------------
  # JOB 1: Rust / Leptos / WASM checks
  # ----------------------------------------------------------
  rust-checks:
    name: "Rust — check / clippy / wasm build"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-rust

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Install the stable toolchain + the WASM target
      - name: Install Rust stable + wasm32 target
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: wasm32-unknown-unknown
          profile: minimal
          override: true

      # Cache Cargo registry and build artefacts
      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: frontend-rust

      # Compile-check (fast, catches type errors without linking)
      - name: cargo check
        run: cargo check --target wasm32-unknown-unknown

      # Lint — treat warnings as errors
      - name: cargo clippy
        run: cargo clippy --target wasm32-unknown-unknown -- -D warnings

      # Install Trunk and build the WASM bundle
      - name: Install Trunk
        run: cargo install --locked trunk

      - name: trunk build (release WASM)
        run: trunk build --release

  # ----------------------------------------------------------
  # JOB 2: Python / FastAPI checks + unit tests
  # ----------------------------------------------------------
  python-checks:
    name: "Python — lint / pytest"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-python

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend-python/requirements.txt

      - name: Install production dependencies
        run: pip install --no-cache-dir -r requirements.txt

      - name: Install dev/test tools
        run: pip install ruff pytest pytest-asyncio

      - name: Ruff lint check
        run: ruff check app/

      - name: pytest — unit + integration tests
        run: pytest tests/ -v --tb=short
        env:
          DATABASE_URL: sqlite:///./data/bookstore_test.db
          JWT_SECRET: ci_test_secret_not_real
          DEBUG: "false"
          SEED: "42"

  # ----------------------------------------------------------
  # JOB 3: Security gates (Trivy FS + Gitleaks)
  # Runs after BOTH code-quality jobs pass
  # ----------------------------------------------------------
  security-scan:
    name: "Security — Trivy FS + Gitleaks"
    runs-on: ubuntu-latest
    needs: [rust-checks, python-checks]

    permissions:
      contents: read
      security-events: write   # required to upload SARIF

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history needed by Gitleaks

      # --- Trivy: filesystem / SCA scan ---
      - name: Trivy — filesystem scan (HIGH + CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"
          format: sarif
          output: trivy-results.sarif
        continue-on-error: false   # hard gate

      # Upload SARIF to GitHub Security tab
      - name: Upload Trivy SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v2
        if: always()              # upload even on failure so results are visible
        with:
          sarif_file: trivy-results.sarif

      # --- Gitleaks: secret / credential scan ---
      - name: Gitleaks — secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

      # Archive all SARIF reports as a workflow artefact
      - name: Upload security reports artefact
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: security-reports
          path: "*.sarif"
          retention-days: 30

  # ----------------------------------------------------------
  # JOB 4: Docker build + Trivy image scan
  # Runs after security gates pass
  # ----------------------------------------------------------
  docker-build:
    name: "Docker — build images + Trivy image scan"
    runs-on: ubuntu-latest
    needs: [security-scan]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Enable BuildKit + multi-platform via buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build backend image
      - name: Build nivara-backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend-python
          file: ./backend-python/Dockerfile
          tags: nivara-backend:test
          load: true          # load into local daemon for Trivy to scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Build frontend image
      - name: Build nivara-frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend-rust
          file: ./frontend-rust/Dockerfile
          tags: nivara-frontend:test
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --- Trivy image scan: backend (CRITICAL = hard gate) ---
      - name: Trivy — image scan backend (CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: nivara-backend:test
          severity: CRITICAL
          exit-code: "1"
          format: table

      # --- Trivy image scan: frontend (informational — HIGH+CRITICAL) ---
      - name: Trivy — image scan frontend (HIGH+CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: nivara-frontend:test
          severity: HIGH,CRITICAL
          exit-code: "0"      # informational only; nginx-alpine is very small
          format: table
